<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員註冊</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <form class="form-box" id="registerForm" onsubmit="event.preventDefault(); register();">
           
            <h2>建立帳號</h2>
            <p class="subtitle">請填寫以下資訊完成註冊</p>

            <div class="input-group">
                <label for="username">使用者名稱</label>
                <input type="text" id="username" name="username" placeholder="請輸入使用者名稱" required>
            </div>

            <div class="input-group">
                <label for="email">電子郵件</label>
                <input type="email" id="email" name="email" placeholder="example@mail.com" required>
            </div>

            <div class="input-group">
                <label for="password">密碼</label>
                <input type="password" id="password" name="password" placeholder="請輸入密碼" required>
            </div>

            <div class="input-group">
                <label for="confirm-password">確認密碼</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="再次輸入密碼" required>
            </div>

            <button type="submit" class="btn">立即註冊</button>

            <div class="footer-link">
                已經有帳號了？ <a href="login-zh.html">點此登錄</a>
            </div>
        </form>
    </div>

    <script>
        async function register() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            // 1. 核心檢查：比對兩次密碼
            if (password !== confirmPassword) {
                alert("錯誤：兩次輸入的密碼不一致，請重新確認！");
                document.getElementById('confirm-password').value = ""; // 清空欄位
                document.getElementById('confirm-password').focus();    // 將游標移回去
                return; // 成功攔截！中斷執行，不傳給後端
            }

            console.log("密碼驗證一致，正在傳送註冊資料...");

            // 2. 驗證通過，透過 fetch 傳送給後端
            try {
                const response = await fetch('/process-register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    // 將資料轉換為後端 qs 模組可以解析的格式
                    body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
                });

                const result = await response.text();
                
                // 將後端回傳的「註冊成功」網頁直接覆蓋畫面
                document.open();
                document.write(result);
                document.close();

            } catch (error) {
                console.error("註冊傳輸失敗:", error);
                alert("連線發生問題，無法完成註冊");
            }
        }
    </script>
</body>
</html>
